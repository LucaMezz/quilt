name: API changes

on:
  pull_request:
    branches: [main]

concurrency:
  group: api-changes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OASDIFF_IMAGE: tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c

jobs:
  changelog:
    name: OpenAPI changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm

      - name: Generate base spec
        run: |
          npm ci
          npm run generate:openapi -w @quilt/api
          mv packages/api/openapi.json "$RUNNER_TEMP/base.json"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate revision spec
        run: |
          npm ci
          npm run generate:openapi -w @quilt/api
          mv packages/api/openapi.json "$RUNNER_TEMP/revision.json"

      - name: Compare specs
        id: compare
        run: |
          oasdiff() { docker run --rm -v "$RUNNER_TEMP:/specs" "$OASDIFF_IMAGE" "$@"; }
          if oasdiff changelog /specs/base.json /specs/revision.json --fail-on INFO > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            oasdiff changelog /specs/base.json /specs/revision.json --format markdown > "$RUNNER_TEMP/changelog.md"
            cat "$RUNNER_TEMP/changelog.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.compare.outputs.changed == 'true' && !github.event.pull_request.head.repo.fork
        with:
          header: api-changes
          path: ${{ runner.temp }}/changelog.md

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.compare.outputs.changed == 'false' && !github.event.pull_request.head.repo.fork
        with:
          header: api-changes
          delete: true
