name: Change size

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  change-size:
    name: Change size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check change size
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'large-change') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/change-size/check-change-size.mjs --base "origin/$BASE_REF"
