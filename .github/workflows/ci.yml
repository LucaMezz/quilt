name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-checks-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

      - run: npx biome ci .

      - run: npx turbo boundaries

      - run: npx turbo run check-types build

      - run: npx turbo run test -- --coverage.enabled

      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Start storage
        run: docker compose -f dev/compose.yaml up -d --wait storage

      - run: npx turbo run test:integration -- --coverage.enabled

      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: integration

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - run: npx turbo run test:browser -F web

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
