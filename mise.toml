# Pinned developer tools. Run `mise install` after cloning.
# Keep kubectl within one minor version of K3S_VERSION in cluster/versions.env.

[tools]
k3d = "5.9.0"
kubectl = "1.37.1"
uv = "0.13.6"
"pipx:schemathesis" = "4.32.7"

[env]
_.file = ["cluster/versions.env", "cluster/project.env"]

[tasks."cluster:dev:up"]
description = "Create the local development k3d cluster"
env = { _.file = "dev/cluster.env" }
run = "cluster/k3d/up.sh"

[tasks."cluster:dev:down"]
description = "Delete the local development k3d cluster"
env = { _.file = "dev/cluster.env" }
run = "k3d cluster delete --config cluster/k3d/cluster.yaml"
