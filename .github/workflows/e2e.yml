name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/e2e/**"
      - "apps/controller/**"
      - "apps/server/**"
      - "packages/**"
      - "cluster/**"
      - "dev/**"
      - "mise.toml"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Start storage
        run: docker compose -f dev/compose.yaml up -d --wait storage

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Create cluster
        run: mise run cluster:dev:up

      - run: npx turbo run test:e2e -F e2e

      - name: Show cluster state
        if: failure()
        run: |
          mise exec -- kubectl --context k3d-quilt-dev get all -A
          mise exec -- kubectl --context k3d-quilt-dev get events -A --sort-by=.lastTimestamp | tail -50
